name: Add a country

# Cuts a country into regions from its admin boundaries, records them in regions.json and,
# when asked, starts the bake that builds and publishes their graphs. Nothing runs on a laptop.

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Extract id, also the file name (e.g. spain)"
        required: true
      url:
        description: "Geofabrik .osm.pbf URL (e.g. https://download.geofabrik.de/europe/spain-latest.osm.pbf)"
        required: true
      country:
        description: "ISO 3166-1 country code (e.g. ES)"
        required: true
      iso_prefix:
        description: "ISO 3166-2 prefix of its regions (e.g. ES-)"
        required: true
      level:
        description: "OSM admin_level of the regions (6 = provinces in most countries)"
        default: "6"
      also:
        description: "Extra ISO 3166-2 codes of other levels, space separated (e.g. IT-23 for a region with no provinces)"
        required: false
      publish:
        description: "Save the list, then bake and publish (off = only show the list)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bake
  cancel-in-progress: false

jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Download the extract
        env:
          URL: ${{ inputs.url }}
        run: curl -fsSL --retry 3 -o extract.osm.pbf "$URL"

      - name: Cut the regions
        env:
          ID: ${{ inputs.id }}
          URL: ${{ inputs.url }}
          COUNTRY: ${{ inputs.country }}
          PREFIX: ${{ inputs.iso_prefix }}
          LEVEL: ${{ inputs.level }}
          ALSO: ${{ inputs.also }}
        run: |
          # Inputs go through the environment, never into the script text.
          python3 scripts/make_regions.py regions.json "$ID" "$URL" extract.osm.pbf \
            "$COUNTRY" "$PREFIX" "$LEVEL" ${ALSO:+--also $ALSO} | tee regions.log
          { echo '```'; cat regions.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the list and start the bake
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regions.json
          git commit -m "Add regions for $ID"
          git push
          gh workflow run bake.yml -f publish=true
